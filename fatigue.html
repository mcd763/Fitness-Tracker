<script>
  const RECOVERY = { fatigued:12, sore:24, worked:72 };

  const MUSCLE_NAMES = {
    chest:'Chest', front_delt:'Front Delt', side_delt:'Side Delt',
    rear_delt:'Rear Delt', triceps:'Triceps', biceps:'Biceps',
    forearms:'Forearms', traps:'Traps', rhomboids:'Rhomboids',
    lats:'Lats', erector_spinae:'Erector Spinae',
    quadratus_lumborum:'Quadratus Lumborum', abs:'Abs',
    obliques:'Obliques', glutes:'Glutes', glute_med:'Glute Med',
    quads:'Quads', hamstrings:'Hamstrings', calves:'Calves',
    hip_flexors:'Hip Flexors',
  };

  const STATUS_COLORS = {
    fatigued:'#900000', sore:'#c05010', worked:'#8a6a10', fresh:'#3a7a20'
  };

  const FRONT_IDS = {
    chest:'fz-chest', front_delt:'fz-front_delt', side_delt:'fz-side_delt',
    biceps:'fz-biceps', forearms:'fz-forearms', abs:'fz-abs',
    obliques:'fz-obliques', hip_flexors:'fz-hip_flexors',
    quads:'fz-quads', calves:'fz-calves',
  };
  const BACK_IDS = {
    traps:'bz-traps', rear_delt:'bz-rear_delt', triceps:'bz-triceps',
    forearms:'bz-forearms', rhomboids:'bz-rhomboids', lats:'bz-lats',
    erector_spinae:'bz-erector_spinae', quadratus_lumborum:'bz-quadratus_lumborum',
    glutes:'bz-glutes', glute_med:'bz-glute_med',
    hamstrings:'bz-hamstrings', calves:'bz-calves',
  };

  let muscleDB = {};
  let entries  = [];
  let fatigueState = {};
  let manualOverrides = JSON.parse(localStorage.getItem('fatigue-overrides') || '{}');

async function initFatigue() {
  const dbg = document.getElementById('debug');
  dbg.textContent += '1. starting\n';
  
  const user = await requireAuth();
  dbg.textContent += '2. user: ' + (user ? user.id : 'NULL') + '\n';
  if (!user) return;

  try {
    const res = await fetch('https://mcd763.github.io/Fitness-Tracker/muscles.json');
    muscleDB = await res.json();
    localStorage.setItem('muscles-cache', JSON.stringify(muscleDB));
    dbg.textContent += '3. muscles loaded: ' + Object.keys(muscleDB).length + '\n';
  } catch(e) {
    dbg.textContent += '3. muscles FAILED: ' + e + '\n';
  }

  entries = await loadSessions(user.id);
  dbg.textContent += '4. sessions: ' + entries.length + '\n';

  const sel = document.getElementById('manual-muscle');
  Object.entries(MUSCLE_NAMES).forEach(([key, name]) => {
    const opt = document.createElement('option');
    opt.value = key; opt.textContent = name;
    sel.appendChild(opt);
  });

  computeFatigue();
  renderDiagram();
  renderStatusTable();
  renderLastWorked();

  document.getElementById('fatigue-subtitle').textContent =
    'Updated from your log · ' + new Date().toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
  
  dbg.textContent += '5. done\n';
}

  function computeFatigue() {
    const now = new Date();
    fatigueState = {};
    Object.keys(MUSCLE_NAMES).forEach(m => {
      fatigueState[m] = { status:'fresh', hoursAgo:Infinity, lastDate:null, primary:false };
    });

    entries.forEach(session => {
      const sessionDate = new Date(session.date + 'T12:00:00');
      const hoursAgo = (now - sessionDate) / 3600000;

      getSessionTypeMuscles(session).forEach(m => updateMuscle([m], hoursAgo, true, session.date));

      (session.exercises || []).forEach(ex => {
        const mapping = findMapping(ex.name);
        if (!mapping) return;
        updateMuscle(mapping.primary,   hoursAgo, true,  session.date);
        updateMuscle(mapping.secondary, hoursAgo, false, session.date);
        updateMuscle(mapping.tertiary,  hoursAgo, false, session.date);
      });
    });

    Object.entries(manualOverrides).forEach(([muscle, override]) => {
      if (fatigueState[muscle]) {
        fatigueState[muscle].status   = override.status;
        fatigueState[muscle].override = true;
      }
    });
  }

  function findMapping(name) {
    if (muscleDB[name]) return muscleDB[name];
    const lower = name.toLowerCase();
    const key = Object.keys(muscleDB).find(k => k.toLowerCase() === lower);
    if (key) return muscleDB[key];
    const partial = Object.keys(muscleDB).find(k =>
      lower.includes(k.toLowerCase()) || k.toLowerCase().includes(lower)
    );
    return partial ? muscleDB[partial] : null;
  }

  function getSessionTypeMuscles(session) {
    if (session.type === 'Stairs') return ['quads','glutes','calves','hamstrings','hip_flexors','erector_spinae'];
    if (session.type === 'Ruck')   return ['quads','glutes','calves','traps','erector_spinae','abs'];
    if (session.type === 'Sandbag') return ['glutes','hamstrings','erector_spinae','quads','forearms'];
    return [];
  }

  function updateMuscle(list, hoursAgo, isPrimary, date) {
    if (!list) return;
    list.forEach(muscle => {
      if (!fatigueState[muscle]) return;
      if (hoursAgo < fatigueState[muscle].hoursAgo) {
        fatigueState[muscle].hoursAgo = hoursAgo;
        fatigueState[muscle].lastDate = date;
        fatigueState[muscle].primary  = isPrimary;
        fatigueState[muscle].status   = getStatus(hoursAgo);
      }
    });
  }

  function getStatus(h) {
    if (h <= RECOVERY.fatigued) return 'fatigued';
    if (h <= RECOVERY.sore)     return 'sore';
    if (h <= RECOVERY.worked)   return 'worked';
    return 'fresh';
  }

  function renderDiagram() {
    const allMaps = {...FRONT_IDS, ...BACK_IDS};
    Object.keys(MUSCLE_NAMES).forEach(muscle => {
      const color  = STATUS_COLORS[fatigueState[muscle]?.status || 'fresh'];
      const opacity = fatigueState[muscle]?.primary === false && fatigueState[muscle]?.status !== 'fresh' ? '0.65' : '1';

      // Paint all matching SVG elements
      document.querySelectorAll(`[id="${FRONT_IDS[muscle]}"], [id="${BACK_IDS[muscle]}"]`).forEach(el => {
        el.setAttribute('fill', color);
        el.setAttribute('opacity', opacity);
      });

      // Also paint paired elements (no explicit id, same onclick)
      document.querySelectorAll(`[onclick="cycleManual('${muscle}')"]`).forEach(el => {
        el.setAttribute('fill', color);
        el.setAttribute('opacity', opacity);
      });
    });
  }

  function renderStatusTable() {
    const groups = {
      'Push':  ['chest','front_delt','side_delt','triceps'],
      'Pull':  ['lats','rhomboids','traps','rear_delt','biceps','forearms'],
      'Core':  ['abs','obliques','erector_spinae','quadratus_lumborum'],
      'Lower': ['quads','hamstrings','glutes','glute_med','calves','hip_flexors'],
    };
    let html = '';
    Object.entries(groups).forEach(([group, muscles]) => {
      html += `<div style="margin-bottom:10px;">
        <div style="font-family:var(--font-display); font-size:10px; font-weight:600; letter-spacing:0.1em; text-transform:uppercase; color:var(--text-label); margin-bottom:6px; padding-bottom:4px; border-bottom:1px solid var(--border-primary);">${group}</div>`;
      muscles.forEach(muscle => {
        const state = fatigueState[muscle];
        if (!state) return;
        const color    = STATUS_COLORS[state.status];
        const hoursText= state.hoursAgo === Infinity ? 'Not worked' : Math.round(state.hoursAgo) + 'h ago';
        const tag      = state.override ? `<span style="font-size:9px; color:var(--text-tertiary); margin-left:4px;">(manual)</span>` : '';
        html += `
          <div style="display:flex; align-items:center; gap:10px; padding:5px 0; border-bottom:1px solid var(--border-primary); font-size:12px;">
            <span style="display:inline-block; width:10px; height:10px; border-radius:2px; background:${color}; flex-shrink:0;"></span>
            <span style="flex:1; color:var(--text-primary);">${MUSCLE_NAMES[muscle]}${tag}</span>
            <span style="color:var(--text-secondary); font-size:11px; text-transform:capitalize;">${state.status}</span>
            <span style="color:var(--text-tertiary); font-size:11px; min-width:70px; text-align:right;">${hoursText}</span>
          </div>`;
      });
      html += '</div>';
    });
    document.getElementById('muscle-status-table').innerHTML = html;
  }

  function renderLastWorked() {
    const container = document.getElementById('last-worked-list');
    const sorted = Object.entries(fatigueState)
      .filter(([,s]) => s.lastDate)
      .sort((a,b) => a[1].hoursAgo - b[1].hoursAgo);
    if (!sorted.length) {
      container.innerHTML = `<p style="font-size:12px; color:var(--text-tertiary);">No sessions logged yet.</p>`;
      return;
    }
    let html = '';
    sorted.forEach(([muscle, state]) => {
      html += `
        <div style="display:flex; align-items:center; gap:10px; padding:5px 0; border-bottom:1px solid var(--border-primary); font-size:12px;">
          <span style="display:inline-block; width:10px; height:10px; border-radius:2px; background:${STATUS_COLORS[state.status]}; flex-shrink:0;"></span>
          <span style="flex:1; color:var(--text-primary);">${MUSCLE_NAMES[muscle]}</span>
          <span style="color:var(--text-tertiary); font-size:11px;">${state.lastDate}</span>
          <span style="color:var(--text-secondary); font-size:11px; min-width:60px; text-align:right;">${Math.round(state.hoursAgo)}h ago</span>
        </div>`;
    });
    container.innerHTML = html;
    const rows = container.querySelectorAll('div');
    if (rows.length) rows[rows.length-1].style.borderBottom = 'none';
  }

  function applyManualOverride() {
    const muscle = document.getElementById('manual-muscle').value;
    const status = document.getElementById('manual-status').value;
    if (!muscle) { alert('Select a muscle.'); return; }
    manualOverrides[muscle] = { status };
    localStorage.setItem('fatigue-overrides', JSON.stringify(manualOverrides));
    computeFatigue(); renderDiagram(); renderStatusTable(); renderLastWorked();
  }

  function clearOverrides() {
    manualOverrides = {};
    localStorage.setItem('fatigue-overrides', JSON.stringify(manualOverrides));
    computeFatigue(); renderDiagram(); renderStatusTable(); renderLastWorked();
  }

  function cycleManual(muscle) {
    const states  = ['fresh','worked','sore','fatigued'];
    const current = manualOverrides[muscle]?.status || fatigueState[muscle]?.status || 'fresh';
    const next    = states[(states.indexOf(current) + 1) % states.length];
    manualOverrides[muscle] = { status: next };
    localStorage.setItem('fatigue-overrides', JSON.stringify(manualOverrides));
    computeFatigue(); renderDiagram(); renderStatusTable(); renderLastWorked();
  }

  function showTip(e, muscle) {
    const state  = fatigueState[muscle];
    const tip    = document.getElementById('tooltip');
    const hours  = state?.hoursAgo === Infinity ? 'Not worked' : Math.round(state.hoursAgo) + 'h ago';
    tip.textContent = `${MUSCLE_NAMES[muscle]} — ${state?.status || 'fresh'} (${hours})`;
    tip.style.display = 'block';
    moveTip(e);
  }
  function moveTip(e) {
    const tip = document.getElementById('tooltip');
    tip.style.left = (e.clientX + 12) + 'px';
    tip.style.top  = (e.clientY - 28) + 'px';
  }
  function hideTip() {
    document.getElementById('tooltip').style.display = 'none';
  }
  document.addEventListener('mousemove', e => {
    if (document.getElementById('tooltip').style.display === 'block') moveTip(e);
  });

  const themes = ['dark','light','purple','blue','red'];
  function applyTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    localStorage.setItem('theme', theme);
    const btn = document.getElementById('theme-toggle');
    if (btn) btn.textContent = themes[(themes.indexOf(theme) + 1) % themes.length];
  }
  function toggleTheme() {
    const current = localStorage.getItem('theme') || 'dark';
    applyTheme(themes[(themes.indexOf(current) + 1) % themes.length]);
  }
  applyTheme(localStorage.getItem('theme') || 'dark');

  initFatigue();
</script>
