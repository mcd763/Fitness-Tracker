<script>
  // ── Recovery thresholds (hours) ───────────────────────────
  const RECOVERY = {
    fatigued: 12,
    sore:     24,
    worked:   72,
    fresh:    Infinity
  };

  // ── Muscle display names ──────────────────────────────────
  const MUSCLE_NAMES = {
    chest:               'Chest',
    front_delt:          'Front Delt',
    side_delt:           'Side Delt',
    rear_delt:           'Rear Delt',
    triceps:             'Triceps',
    biceps:              'Biceps',
    forearms:            'Forearms',
    traps:               'Traps',
    rhomboids:           'Rhomboids',
    lats:                'Lats',
    erector_spinae:      'Erector Spinae',
    quadratus_lumborum:  'Quadratus Lumborum',
    abs:                 'Abs',
    obliques:            'Obliques',
    glutes:              'Glutes',
    glute_med:           'Glute Med',
    quads:               'Quads',
    hamstrings:          'Hamstrings',
    calves:              'Calves',
    hip_flexors:         'Hip Flexors',
  };

  // ── SVG element IDs per muscle ────────────────────────────
  const MUSCLE_ELEMENTS = {
    chest:              ['front-chest'],
    front_delt:         ['front-front_delt_l','front-front_delt_r'],
    side_delt:          ['front-side_delt_l','front-side_delt_r'],
    rear_delt:          ['back-rear_delt_l','back-rear_delt_r'],
    triceps:            ['back-triceps_l','back-triceps_r'],
    biceps:             ['front-biceps_l','front-biceps_r'],
    forearms:           ['front-forearms_l','front-forearms_r','back-forearms_bl','back-forearms_br'],
    traps:              ['back-traps'],
    rhomboids:          ['back-rhomboids'],
    lats:               ['back-lats_l','back-lats_r'],
    erector_spinae:     ['back-erector_spinae'],
    quadratus_lumborum: ['back-quadratus_lumborum_l','back-quadratus_lumborum_r'],
    abs:                ['front-abs'],
    obliques:           ['front-obliques_l','front-obliques_r'],
    glutes:             ['back-glutes'],
    glute_med:          ['back-glute_med_l','back-glute_med_r'],
    quads:              ['front-quads_l','front-quads_r'],
    hamstrings:         ['back-hamstrings_l','back-hamstrings_r'],
    calves:             ['front-calves_l','front-calves_r','back-calves_l','back-calves_r'],
    hip_flexors:        ['front-hip_flexors'],
  };

  // ── Status colors ─────────────────────────────────────────
  const STATUS_COLORS = {
    fatigued:  '#8a0000',
    sore:      '#c0440f',
    worked:    '#7a6120',
    fresh:     '#2d5a1b',
    secondary: '#1a3a0a',
  };

  let muscleDB     = {};
  let entries      = [];
  let fatigueState = {}; // muscle → { status, hoursAgo, lastDate, override }
  let manualOverrides = JSON.parse(localStorage.getItem('fatigue-overrides') || '{}');

  // ── Load data ─────────────────────────────────────────────
  async function initFatigue() {
    const user = await requireAuth();
    if (!user) return;

    // Load muscle database
    try {
      const res = await fetch('muscles.json');
      muscleDB = await res.json();
    } catch(e) {
      console.error('Failed to load muscles.json', e);
    }

    // Load sessions
    entries = await loadSessions(user.id);

    // Populate manual muscle dropdown
    const sel = document.getElementById('manual-muscle');
    Object.entries(MUSCLE_NAMES).forEach(([key, name]) => {
      const opt = document.createElement('option');
      opt.value = key;
      opt.textContent = name;
      sel.appendChild(opt);
    });

    computeFatigue();
    renderDiagram();
    renderStatusTable();
    renderLastWorked();

    document.getElementById('fatigue-subtitle').textContent =
      'Auto-updated from your log · ' + new Date().toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' });
  }

  // ── Compute fatigue from sessions ─────────────────────────
  function computeFatigue() {
    const now = new Date();

    // Reset
    fatigueState = {};
    Object.keys(MUSCLE_NAMES).forEach(m => {
      fatigueState[m] = { status:'fresh', hoursAgo: Infinity, lastDate: null, primary: false };
    });

    // Walk through all sessions and track most recent hit per muscle
    entries.forEach(session => {
      const sessionDate = new Date(session.date + 'T12:00:00'); // noon to avoid timezone issues
      const hoursAgo = (now - sessionDate) / 3600000;

      // Map session type for stair/ruck
      const sessionTypeMuscles = getSessionTypeMuscles(session);

      // Exercises
      const exercises = session.exercises || [];
      exercises.forEach(ex => {
        const mapping = findMapping(ex.name);
        if (!mapping) return;
        updateMuscle(mapping.primary,   hoursAgo, true,  session.date);
        updateMuscle(mapping.secondary, hoursAgo, false, session.date);
        updateMuscle(mapping.tertiary,  hoursAgo, false, session.date);
      });

      // Session type muscles (stairs/ruck with no exercise list)
      sessionTypeMuscles.forEach(m => updateMuscle([m], hoursAgo, true, session.date));
    });

    // Apply manual overrides
    Object.entries(manualOverrides).forEach(([muscle, override]) => {
      if (fatigueState[muscle]) {
        fatigueState[muscle].status   = override.status;
        fatigueState[muscle].override = true;
      }
    });
  }

  function findMapping(exerciseName) {
    // Exact match first
    if (muscleDB[exerciseName]) return muscleDB[exerciseName];
    // Case-insensitive match
    const lower = exerciseName.toLowerCase();
    const key = Object.keys(muscleDB).find(k => k.toLowerCase() === lower);
    if (key) return muscleDB[key];
    // Partial match — exercise name contains a known key
    const partial = Object.keys(muscleDB).find(k => lower.includes(k.toLowerCase()) || k.toLowerCase().includes(lower));
    return partial ? muscleDB[partial] : null;
  }

  function getSessionTypeMuscles(session) {
    const muscles = [];
    if (session.type === 'Stairs' && session.stairsData) {
      muscles.push(...['quads','glutes','calves','hamstrings','hip_flexors','erector_spinae']);
    }
    if (session.type === 'Ruck' && session.ruckData) {
      muscles.push(...['quads','glutes','calves','traps','erector_spinae','abs']);
    }
    if (session.type === 'Sandbag') {
      muscles.push(...['glutes','hamstrings','erector_spinae','quads','forearms']);
    }
    return muscles;
  }

  function updateMuscle(muscleList, hoursAgo, isPrimary, date) {
    if (!muscleList) return;
    muscleList.forEach(muscle => {
      if (!fatigueState[muscle]) return;
      if (hoursAgo < fatigueState[muscle].hoursAgo) {
        fatigueState[muscle].hoursAgo  = hoursAgo;
        fatigueState[muscle].lastDate  = date;
        fatigueState[muscle].primary   = isPrimary;
        fatigueState[muscle].status    = getStatus(hoursAgo);
      }
    });
  }

  function getStatus(hoursAgo) {
    if (hoursAgo <= RECOVERY.fatigued) return 'fatigued';
    if (hoursAgo <= RECOVERY.sore)     return 'sore';
    if (hoursAgo <= RECOVERY.worked)   return 'worked';
    return 'fresh';
  }

  // ── Render SVG diagram ────────────────────────────────────
  function renderDiagram() {
    Object.entries(MUSCLE_ELEMENTS).forEach(([muscle, ids]) => {
      const state  = fatigueState[muscle];
      const color  = state ? STATUS_COLORS[state.status] : STATUS_COLORS.fresh;
      const opacity = state && !state.primary && state.status !== 'fresh' ? '0.6' : '1';
      ids.forEach(id => {
        const el = document.getElementById(id);
        if (el) {
          el.setAttribute('fill', color);
          el.setAttribute('opacity', opacity);
        }
      });
    });
  }

  // ── Render status table ───────────────────────────────────
  function renderStatusTable() {
    const container = document.getElementById('muscle-status-table');
    const groups = {
      'Push':  ['chest','front_delt','side_delt','triceps'],
      'Pull':  ['lats','rhomboids','traps','rear_delt','biceps','forearms'],
      'Core':  ['abs','obliques','erector_spinae','quadratus_lumborum'],
      'Lower': ['quads','hamstrings','glutes','glute_med','calves','hip_flexors'],
    };

    let html = '';
    Object.entries(groups).forEach(([group, muscles]) => {
      html += `<div style="margin-bottom:10px;">
        <div style="font-family:var(--font-display); font-size:10px; font-weight:600; letter-spacing:0.1em; text-transform:uppercase; color:var(--text-label); margin-bottom:6px; padding-bottom:4px; border-bottom:1px solid var(--border-primary);">${group}</div>`;
      muscles.forEach(muscle => {
        const state = fatigueState[muscle];
        if (!state) return;
        const color = STATUS_COLORS[state.status];
        const hoursText = state.hoursAgo === Infinity ? 'Not worked' : Math.round(state.hoursAgo) + 'h ago';
        const overrideTag = state.override ? `<span style="font-size:9px; color:var(--text-tertiary); margin-left:4px;">(manual)</span>` : '';
        html += `
          <div style="display:flex; align-items:center; gap:10px; padding:5px 0; border-bottom:1px solid var(--border-primary); font-size:12px;">
            <span style="display:inline-block; width:10px; height:10px; border-radius:2px; background:${color}; flex-shrink:0;"></span>
            <span style="flex:1; color:var(--text-primary);">${MUSCLE_NAMES[muscle]}${overrideTag}</span>
            <span style="color:var(--text-secondary); font-size:11px; text-transform:capitalize;">${state.status}</span>
            <span style="color:var(--text-tertiary); font-size:11px; min-width:70px; text-align:right;">${hoursText}</span>
          </div>`;
      });
      html += '</div>';
    });
    container.innerHTML = html;
  }

  // ── Render last worked list ───────────────────────────────
  function renderLastWorked() {
    const container = document.getElementById('last-worked-list');
    const sorted = Object.entries(fatigueState)
      .filter(([, s]) => s.lastDate)
      .sort((a, b) => a[1].hoursAgo - b[1].hoursAgo);

    if (sorted.length === 0) {
      container.innerHTML = `<p style="font-size:12px; color:var(--text-tertiary);">No sessions logged yet.</p>`;
      return;
    }

    let html = '';
    sorted.forEach(([muscle, state]) => {
      const color = STATUS_COLORS[state.status];
      html += `
        <div style="display:flex; align-items:center; gap:10px; padding:5px 0; border-bottom:1px solid var(--border-primary); font-size:12px;">
          <span style="display:inline-block; width:10px; height:10px; border-radius:2px; background:${color}; flex-shrink:0;"></span>
          <span style="flex:1; color:var(--text-primary);">${MUSCLE_NAMES[muscle]}</span>
          <span style="color:var(--text-tertiary); font-size:11px;">${state.lastDate}</span>
          <span style="color:var(--text-secondary); font-size:11px; min-width:60px; text-align:right;">${Math.round(state.hoursAgo)}h ago</span>
        </div>`;
    });
    container.innerHTML = html;

    const rows = container.querySelectorAll('div');
    if (rows.length) rows[rows.length-1].style.borderBottom = 'none';
  }

  // ── Manual override ───────────────────────────────────────
  function applyManualOverride() {
    const muscle = document.getElementById('manual-muscle').value;
    const status = document.getElementById('manual-status').value;
    if (!muscle) { alert('Select a muscle.'); return; }
    manualOverrides[muscle] = { status };
    localStorage.setItem('fatigue-overrides', JSON.stringify(manualOverrides));
    computeFatigue();
    renderDiagram();
    renderStatusTable();
    renderLastWorked();
  }

  function clearOverrides() {
    manualOverrides = {};
    localStorage.setItem('fatigue-overrides', JSON.stringify(manualOverrides));
    computeFatigue();
    renderDiagram();
    renderStatusTable();
    renderLastWorked();
  }

  // ── Click muscle on diagram to cycle status ───────────────
  function cycleManual(muscle) {
    const states   = ['fresh','worked','sore','fatigued'];
    const current  = manualOverrides[muscle]?.status || fatigueState[muscle]?.status || 'fresh';
    const next     = states[(states.indexOf(current) + 1) % states.length];
    manualOverrides[muscle] = { status: next };
    localStorage.setItem('fatigue-overrides', JSON.stringify(manualOverrides));
    computeFatigue();
    renderDiagram();
    renderStatusTable();
    renderLastWorked();
  }

  // ── Theme ─────────────────────────────────────────────────
  const themes = ['dark','light','purple','blue','red'];
  function applyTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    localStorage.setItem('theme', theme);
    const btn = document.getElementById('theme-toggle');
    if (btn) btn.textContent = themes[(themes.indexOf(theme) + 1) % themes.length];
  }
  function toggleTheme() {
    const current = localStorage.getItem('theme') || 'dark';
    applyTheme(themes[(themes.indexOf(current) + 1) % themes.length]);
  }
  applyTheme(localStorage.getItem('theme') || 'dark');

  // ── Start ─────────────────────────────────────────────────
  initFatigue();
</script>
